<style>
:root{--bg:#14161f;--panel:#1d2030;--ink:#e8e9f0;--mute:#8b8fa6;--grid:#252941;--accent:#ffb347;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eceef5;--panel:#fff;--ink:#1c1f2e;--mute:#6b6f86;--grid:#dde0ee;--accent:#e07a00}}
:root[data-theme="dark"]{--bg:#14161f;--panel:#1d2030;--ink:#e8e9f0;--mute:#8b8fa6;--grid:#252941;--accent:#ffb347}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}
.game{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.board{position:relative;border-radius:10px;overflow:hidden;background:var(--panel);padding:8px}
canvas{display:block;max-width:100%}
.side{display:flex;flex-direction:column;gap:12px;width:130px}
#msg{height:22px;text-align:center;color:var(--accent);font-weight:700;margin-top:6px}
.card{background:var(--panel);border-radius:10px;padding:12px}
.card small{display:block;color:var(--mute);font-size:13px;margin-bottom:4px}
.card b{font-size:26px;font-variant-numeric:tabular-nums}
.help{color:var(--mute);font-size:13px;line-height:1.6}
.overlay{position:absolute;inset:0;background:rgba(10,11,18,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;color:#fff}
.overlay h1{margin:0;font-size:30px}.mh{font-size:11px;letter-spacing:2px;color:#8b8fa6;text-transform:uppercase;margin-top:6px}.overlay button{min-width:200px}
.overlay p{margin:0;color:#c3c6d8;font-size:14px}
button{font:inherit;border:0;border-radius:8px;background:var(--accent);color:#1c1300;padding:10px 20px;font-weight:700;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.pad{display:none;gap:8px;margin-top:10px;justify-content:center;flex-wrap:wrap}
.pad button{padding:12px 16px;font-size:18px;background:var(--panel);color:var(--ink)}
@media (pointer:coarse){.pad{display:flex}}
.modal{position:fixed;inset:0;background:rgba(10,11,18,.7);display:none;align-items:center;justify-content:center;padding:12px;z-index:20}
.panel{background:var(--panel);border-radius:12px;padding:16px;width:min(380px,100%);max-height:90vh;overflow:auto}
.panel h2{margin:14px 0 4px;font-size:15px}.panel h2:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:8px;margin:8px 0}
.row label{flex:1;font-size:14px}.row input[type=range]{flex:1.4}
.row output{width:44px;text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
.keybtn{min-width:104px;background:var(--grid);color:var(--ink);padding:6px 10px}
.keybtn.wait{outline:2px solid var(--accent)}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#gear{background:var(--panel);color:var(--ink);font-size:14px;padding:10px 8px}
.vsrow{display:flex;flex-direction:column;gap:8px;align-items:center;margin-top:4px}
#vs{background:transparent;color:#fff;border:2px solid var(--accent)}
.bl{font-size:13px;color:#c3c6d8;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.bl input{width:110px}.bl output{width:100%;text-align:center;color:#fff}
#nk{background:#ef5b5b;color:#fff}
#nk.green{background:#3ecf6e;color:#06210f}
.ttl{text-align:center;margin-bottom:12px}
.ttl h1{margin:0;font-size:34px;letter-spacing:1px;color:var(--accent)}
.ttl .sub{color:var(--mute);font-size:14px;margin-top:2px}
.ttl .ver{color:var(--mute);font-size:11px;opacity:.7;margin-top:3px;letter-spacing:1px}
#mon{position:relative;width:192px;height:372px;border-radius:10px;background:var(--panel);transition:width .9s cubic-bezier(.2,.8,.2,1),height .9s cubic-bezier(.2,.8,.2,1)}
#mon canvas{position:absolute}
#mc{left:0;top:0;display:none;pointer-events:none}
#bc{left:6px;top:6px;width:180px;height:360px;border-radius:6px;transition:left .9s cubic-bezier(.2,.8,.2,1),top .9s cubic-bezier(.2,.8,.2,1)}
#mon.monster{width:456px;height:660px;background:transparent}
#mon.monster #mc{display:block}
#mon.monster #bc{left:138px;top:192px}
#mon.shake,.board.shake{animation:shk .45s}
@keyframes shk{0%,100%{transform:translate(0)}20%{transform:translate(-7px,2px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-5px,3px)}80%{transform:translate(3px,-2px)}}
#rage{height:7px;background:var(--grid);border-radius:4px;margin-top:8px;overflow:hidden}
#rageb{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb347,#ef5b5b);transition:width .3s}
@media (max-width:1150px){#mon.monster{zoom:.8}}
.srow{display:flex;justify-content:space-between;align-items:baseline;margin:5px 0}.srow small{display:inline;margin:0}.srow b{font-size:18px}
.hr{display:grid;grid-template-columns:44px 1fr 92px;gap:10px;align-items:center;background:var(--bg);border-radius:6px;padding:8px 10px 14px;margin:5px 0}.hl{font-size:14px;letter-spacing:1px;color:#8fa0c8}.ht{position:relative}.ht i{position:absolute;top:12px;font-size:8px;color:var(--mute);font-style:normal}.ht i:first-of-type{left:0}.ht i:last-of-type{right:0}
.hs{width:100%;-webkit-appearance:none;appearance:none;height:3px;background:#0c0e16;border-radius:2px;outline:0}.hs::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:18px;background:#2a3047;border:1px solid #4a5170;border-radius:2px}.hs::-moz-range-thumb{width:12px;height:18px;background:#2a3047;border:1px solid #4a5170;border-radius:2px}
.hv{display:flex;align-items:baseline;justify-content:flex-end;gap:4px}.hv small{font-size:9px;color:var(--mute)}.hv b{font-size:20px}.hv u{text-decoration:none;color:var(--mute)}
.trg{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:250px}.trg button{min-width:0;flex:1 1 44%;font-size:12px;padding:8px 6px}.trg button.sel{outline:2px solid #fff}
.sbg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.sbg button{padding:6px 0;min-width:0;font-size:13px}.sbg button[data-sb=clear],.sbg button[data-sb=grav]{grid-column:span 2;font-size:11px}
button:disabled{opacity:.4;cursor:default}
.hs{height:22px;background:transparent}.hs::-webkit-slider-runnable-track{height:3px;background:#0c0e16;border-radius:2px}.hs::-moz-range-track{height:3px;background:#0c0e16;border-radius:2px}.hs::-webkit-slider-thumb{margin-top:-8px}.ht i{pointer-events:none;top:26px}.hr{padding-bottom:20px}
#logo{height:100px;width:auto;animation:flt 4s ease-in-out infinite;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}@keyframes flt{50%{transform:translateY(-4px)}}
#nkf{width:130px;height:auto;margin:0 auto 6px;display:none;animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px) rotate(1.5deg)}}
</style>

if(!bot.plan){if(prof().nuke&&bot.nukeCd<=0&&bot.atkCd<=0&&!nukeP&&running)startNukeP();botPlan();if(!bot.alive)break;}
var dur=(bot.q.length?bot.q[0].w:1)*bot.itv;
if(bot.acc<dur)break;bot.acc-=dur;
if(bot.q.length)botApply(bot.q.shift());else botLock();}
drawBot();}
function drawBot(){setFace();bx.fillStyle=css('--panel');bx.fillRect(0,0,240,480);
bx.strokeStyle=css('--grid');bx.lineWidth=1;bx.beginPath();
for(var i=1;i<COLS;i++){bx.moveTo(i*S+.5,0);bx.lineTo(i*S+.5,480);}
for(var j=1;j<ROWS;j++){bx.moveTo(0,j*S+.5);bx.lineTo(240,j*S+.5);}
bx.stroke();
for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++)if(bot.board[y][x])cell(bx,x,y,COLORS[bot.board[y][x]]);
if(bot.p&&bot.alive)bot.p.m.forEach(function(row,yy){row.forEach(function(v,xx){if(v)cell(bx,bot.p.x+xx,bot.p.y+yy,COLORS[bot.cur]);});});
if(bot.pend){bx.fillStyle='#ef5b5b';bx.fillRect(0,480-bot.pend*S,5,bot.pend*S);}
var n=bot.nuke;
if(n&&n.ph===0){cell(bx,n.x,n.y,'#ff5a1f');bx.fillStyle='#fff';bx.font='18px sans-serif';bx.textAlign='center';bx.fillText('☢',n.x*S+S/2,n.y*S+S-4);}
if(n&&n.ph===1){var f=n.t/700,rad=30+f*260;var g=bx.createRadialGradient(n.x*S+S/2,n.y*S,5,n.x*S+S/2,n.y*S,rad);
g.addColorStop(0,'rgba(255,245,200,'+(1-f)+')');g.addColorStop(.5,'rgba(255,120,30,'+(.8*(1-f))+')');g.addColorStop(1,'rgba(255,60,0,0)');
bx.fillStyle=g;bx.fillRect(0,0,240,480);}
if(bot.stun>0&&!(bot.ice>0)){bx.fillStyle='rgba(10,11,18,.45)';bx.fillRect(0,0,240,480);bx.fillStyle='rgba(255,60,60,.55)';
for(var gi=0;gi<7;gi++)bx.fillRect(Math.random()*40,Math.random()*480,120+Math.random()*120,3+Math.random()*5);
bx.fillStyle='#fff';bx.font='bold 22px sans-serif';bx.textAlign='center';bx.fillText('SYSTEM ERROR',120,240);}
if(bot.ice>0){bx.fillStyle='rgba(150,220,255,.45)';bx.fillRect(0,0,240,480);bx.font='bold 60px sans-serif';bx.textAlign='center';bx.fillText('❄',120,260);}
if(bot.mad>0){bx.fillStyle='rgba(255,40,40,'+Math.min(.45,bot.mad/900*.45)+')';bx.fillRect(0,0,240,480);bx.font='bold 54px sans-serif';bx.textAlign='center';bx.fillText('😠',120,70+Math.sin(performance.now()/40)*4);}
bpops.forEach(function(p){drawPop(bx,p,240);});
if(bot.chg>0){bx.strokeStyle='rgba(255,170,40,'+(.5+.5*Math.sin(performance.now()/60))+')';bx.lineWidth=8;bx.strokeRect(4,4,232,472);}
if(!bot.alive){bx.fillStyle='rgba(10,11,18,.6)';bx.fillRect(0,0,240,480);}}
/* ---- Nukie monster (built from tetris blocks, Nukie's board lives in its chest) ---- */
var mctx=document.getElementById('mc').getContext('2d'),MP=30,MT=48,MU=18,CK=['I','O','T','S','Z','J','L'];
function buildMon(){if(mb)return;mb=[];
function add(c,r,k,l){mb.push({c:c,r:r,k:k,l:l,col:COLORS[CK[(r*5+c*3)%7]],dl:(33-r)*0.03+Math.random()*0.18,sx:(Math.random()-.5)*900,sy:-250-Math.random()*400,sr:(Math.random()-.5)*7});}
var r,c;
[[3,0],[18,0],[3,1],[4,1],[17,1],[18,1],[4,2],[17,2]].forEach(function(p){add(p[0],p[1],'H','head');});
for(c=7;c<=14;c++)add(c,1,'H','head');
for(r=2;r<=6;r++)for(c=(r===6?6:5);c<=(r===6?15:16);c++){var k='H';if((r===3||r===4)&&(c===7||c===8||c===13||c===14))k='E';if(r===5&&c>=7&&c<=14)k='M';add(c,r,k,'head');}
for(c=4;c<=17;c++){add(c,7,'B','body');add(c,28,'B','body');}
for(r=8;r<=27;r++)[4,5,16,17].forEach(function(cc){add(cc,r,'B','body');});
for(r=7;r<=27;r++){var w=(r<=9||r>=24)?4:3;for(c=0;c<w;c++){add(c,r,'B','AL');add(21-c,r,'B','AR');}}
for(r=29;r<=33;r++)(r===33?[4,5,6,7,8,9]:[5,6,7,8]).forEach(function(cc){add(cc,r,'B','LL');add(21-cc,r,'B','LR');});}
function drawMonster(t){buildMon();var c=mctx;c.clearRect(0,0,456,660);
if(mon.t0<0){mon.t0=t;mon.lt=t;}
var dm=Math.min(50,t-mon.lt);mon.lt=t;var a=(t-mon.t0)/1000,s=t/1000;
mon.hurt=Math.max(0,mon.hurt-dm/700);mon.pl=Math.max(0,mon.pl-dm/260);mon.pr=Math.max(0,mon.pr-dm/260);
mon.charge=(nukeP&&nukeP.ph===0)?Math.min(1,mon.charge+dm/300):Math.max(0,mon.charge-dm/300);
var stun=bot.stun>0,bob=Math.sin(s*2.2)*3+(mon.hurt?Math.sin(s*60)*mon.hurt*4:0);
var g=c.createRadialGradient(MP+11*MU,MT+17*MU,20,MP+11*MU,MT+17*MU,300),pu=.16+.06*Math.sin(s*2)+mon.charge*.15;
g.addColorStop(0,'rgba(190,70,255,'+pu+')');g.addColorStop(1,'rgba(190,70,255,0)');c.fillStyle=g;c.fillRect(0,0,456,660);
if(!parts.length)for(var i=0;i<16;i++)parts.push({x:Math.random()*456,y:Math.random()*660,v:.2+Math.random()*.6,sz:3+Math.random()*5,col:COLORS[CK[i%7]]});
c.globalAlpha=.5;parts.forEach(function(p){p.y-=p.v*dm/16;if(p.y<-10){p.y=670;p.x=Math.random()*456;}c.fillStyle=p.col;c.fillRect(p.x,p.y,p.sz,p.sz);});c.globalAlpha=1;
var AL=mon.pl*1.4+mon.charge*2.5,AR=mon.pr*1.4+mon.charge*2.5;
mb.forEach(function(b){var p=Math.min(1,Math.max(0,(a-b.dl)/0.8));if(p<=0)return;
var q=p-1,e=1+2.7*q*q*q+1.7*q*q,x=MP+b.c*MU,y=MT+b.r*MU+bob,ang=0,px=0,py=0,ox=0,oy=0;
if(b.l==='AL'){ang=.05*Math.sin(s*2)+AL;px=MP+1.5*MU;py=MT+8*MU+bob;ox=-mon.pl*8;}
else if(b.l==='AR'){ang=-(.05*Math.sin(s*2+1)+AR);px=MP+20.5*MU;py=MT+8*MU+bob;ox=mon.pr*8;}
else if(b.l==='head'){ang=.03*Math.sin(s*1.7)+(mon.hurt?Math.sin(s*50)*mon.hurt*.12:0);px=MP+11*MU;py=MT+7*MU+bob;}
else if(b.l==='LL')oy=Math.max(0,Math.sin(s*3))*3;else if(b.l==='LR')oy=Math.max(0,-Math.sin(s*3))*3;
if(ang){var dx=x+MU/2-px,dy=y+MU/2-py,ca=Math.cos(ang),sa=Math.sin(ang);x=px+dx*ca-dy*sa-MU/2;y=py+dx*sa+dy*ca-MU/2;}
x+=ox+b.sx*(1-e);y+=oy+b.sy*(1-e);if(stun&&Math.random()<.18)x+=(Math.random()-.5)*10;
var col=b.col;if(b.k==='M')col=b.c%2?'#f3f3f3':'#2a1230';
c.save();c.translate(x+MU/2,y+MU/2);c.rotate(ang+b.sr*(1-e));c.globalAlpha=stun?.75:Math.min(1,p*2);
if(b.k==='E'){col=stun?(Math.random()<.5?'#444':'#222'):(mon.charge>0?'#ffe14a':'#ff3b3b');if(!stun){c.shadowColor=col;c.shadowBlur=10+6*Math.sin(s*5)+mon.charge*14;}}
c.fillStyle=col;c.fillRect(-MU/2+1,-MU/2+1,MU-2,MU-2);c.shadowBlur=0;
c.fillStyle='rgba(255,255,255,'+(.22+.08*Math.sin(s*3+b.c+b.r))+')';c.fillRect(-MU/2+1,-MU/2+1,MU-2,4);c.restore();});
if(mon.hurt>0){c.globalCompositeOperation='source-atop';c.fillStyle='rgba(255,255,255,'+Math.min(.6,mon.hurt*.4)+')';c.fillRect(0,0,456,660);c.globalCompositeOperation='source-over';}
if(mon.charge>0){c.save();c.translate(MP+11*MU,MT-6);c.rotate(s*2);c.globalAlpha=mon.charge;c.fillStyle='#ffd23f';c.shadowColor='#ff7a18';c.shadowBlur=24;
c.font='bold '+(42+8*Math.sin(s*8))+'px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('☢',0,0);c.restore();}}
function loop(t){
if(running&&!paused){var dt=Math.min(t-last,100);last=t;var speed=(dev.nog||(mode==='sbx'&&sbNoG))?1e12:Math.max(60,800-(level-1)*70)/(dev.spd||1);
if(cutT>0)cutT-=dt;else if(hd){dasT+=dt;if(dasT>=cfg.das){
if(cfg.arr===0){var mv=false;while(!hit(piece.m,piece.x+hd,piece.y)){piece.x+=hd;mv=true;}if(mv){lastRot=false;bump();}}
else{arrT+=dt;while(arrT>=cfg.arr){arrT-=cfg.arr;move(hd);}}}}
if(held_.down&&running){if(cfg.sdf>=41){while(!grounded())soft();}
else{sdT+=dt;var itv=speed/cfg.sdf;while(sdT>=itv&&!grounded()){sdT-=itv;soft();}}}else sdT=0;
if(grounded()){acc=0;lockT+=dt;if(lockT>=LOCK)lock();}
else{lockT=0;acc+=dt;
while(acc>=speed&&running&&!grounded()){acc-=speed;piece.y++;lastRot=false;if(piece.y>lowest){lowest=piece.y;resets=0;}}}
specCd-=dt;devTick();modeTick(dt);if(vs||mode){tms+=dt;tmTick();}if(vs&&bot.alive&&!dev.bfz)botTick(dt);if(nukeP)updNukeP(dt);
draw();}
else last=t;drawThrows(t);drawBg(t);if(lg){lg.t-=fdt;if(lg.t<=0)lg=null;}if(sf>0)sf-=fdt;pops=pops.filter(function(p){p.l-=fdt;return p.l>0;});bpops=bpops.filter(function(p){p.l-=fdt;return p.l>0;});
requestAnimationFrame(loop);}
board=[];for(var y=0;y<ROWS;y++)board.push(new Array(COLS).fill(0));
draw();requestAnimationFrame(loop);
})();
